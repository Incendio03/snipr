<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snipr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%237C3AED' d='M1 1h14v8.4L9.4 15H1z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Main">
    <a class="nav__logo" href="#/review"><span class="nav__mark" aria-hidden="true"></span>snipr</a>
    <div class="nav__links">
      <a class="nav__link" href="#/review" data-nav="review">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>
        Review
        <span class="nav__badge" id="nav-review" hidden></span>
      </a>
      <a class="nav__link" href="#/streamers" data-nav="streamers">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path></svg>
        Streamers
      </a>
      <a class="nav__link" href="#/publishing" data-nav="publishing">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M4 20h16"></path></svg>
        Publishing
        <span class="nav__badge nav__badge--warn" id="nav-publishing" hidden></span>
      </a>
      <a class="nav__link" href="#/activity" data-nav="activity">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>
        Activity
        <span class="nav__badge nav__badge--danger" id="nav-activity" hidden></span>
      </a>
    </div>
    <div class="nav__foot">
      <div class="nav__conn" id="nav-conn" role="status" hidden></div>
      <a class="nav__link" href="#/settings" data-nav="settings">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8"></path><path d="M16 6h4"></path><circle cx="14" cy="6" r="2"></circle><path d="M4 12h2"></path><path d="M10 12h10"></path><circle cx="8" cy="12" r="2"></circle><path d="M4 18h10"></path><path d="M18 18h2"></path><circle cx="16" cy="18" r="2"></circle></svg>
        Settings
      </a>
      <span class="nav__version" id="nav-version"></span>
    </div>
  </nav>
  <main class="main" id="main" tabindex="-1">
    <noscript><p>Snipr needs JavaScript to run. Turn it on in your browser and reload.</p></noscript>
  </main>
</div>
<div class="toasts" id="toasts" aria-label="Notifications"></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
